# Builds the firmware from source on every push and pull request.
# A tag v* additionally publishes a GitHub release with the UF2 files,
# so every download can be traced back to the exact source and build log.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Same image as the GitLab pipeline, pinned by digest.
    container:
      image: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PIN lock host simulation
        run: tests/run.sh

      - name: Fetch vial-qmk at the pinned commit
        run: |
          ref=$(cat vial-qmk.ref)
          git init -q /tmp/vial-qmk
          git -C /tmp/vial-qmk remote add origin https://github.com/vial-kb/vial-qmk.git
          git -C /tmp/vial-qmk fetch -q --depth 1 origin "$ref"
          git -C /tmp/vial-qmk checkout -q FETCH_HEAD
          git -C /tmp/vial-qmk submodule update -q --init --depth 1 --recursive -j 4

      - name: Build
        run: scripts/build.sh /tmp/vial-qmk out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s9b-firmware
          path: |
            out/s9b-update.uf2
            out/s9b-first-install.uf2
            out/SHA256SUMS
            out/s9b.elf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s9b-firmware
          path: out

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          {
            echo
            echo "**Which file?** \`s9b-first-install.uf2\` when coming from the vendor firmware,"
            echo "\`s9b-update.uf2\` for updates. Read the [README](https://github.com/${GITHUB_REPOSITORY}#readme) first."
            echo
            echo "Built by GitHub Actions from \`${GITHUB_SHA}\` (vial-qmk \`$(cat vial-qmk.ref)\`)."
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            out/s9b-update.uf2 out/s9b-first-install.uf2 out/SHA256SUMS
